plugins {
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'jacoco'
}

group = 'com.gestionpolizas'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Documentación OpenAPI / Swagger (equivalente estándar y público al Swagger corporativo).
    // Versión 2.8.x compatible con Spring Boot 3.4.x (Spring Framework 6.2).
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // Base de datos en memoria H2 (perfil por defecto: ejecución local sin instalar nada)
    runtimeOnly 'com.h2database:h2:2.2.224'

    // Driver PostgreSQL (perfil 'postgres': persistencia productiva)
    runtimeOnly 'org.postgresql:postgresql:42.7.3'

    // Lombok (reduce boilerplate en entidades y DTOs)
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters']
}
